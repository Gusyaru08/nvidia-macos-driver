name: Build Metal plugin

# Builds the Metal plugin (NVMTLDriver) the way build/build_plugin.sh does, in release mode, for macOS 15 x86_64.
# Two binaries come out: this branch's plugin and an unmodified build of the 1.13.0 release it is based on, so a
# self-built plugin can be checked on its own before the change is tried. The plugin calls into NVK internals, so the
# branch must sit on top of that release.

on:
  push:
    branches: [main]
    paths:
      - 'plugin/**'
      - '.github/workflows/build-plugin.yml'
      - '.github/plugin-artifact/**'
  pull_request:
    paths:
      - 'plugin/**'
      - '.github/workflows/build-plugin.yml'
      - '.github/plugin-artifact/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    env:
      VULKAN_HEADERS_TAG: v1.4.341
      DRIVER_VERSION: 1.13.0
      BASE_COMMIT: 0960b2ef5dbc4a573056d4c8e042a5bd2e15d651   # "Driver and Mac app 1.13.0"
      SRC_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vulkan headers
        run: git clone --depth 1 --branch "$VULKAN_HEADERS_TAG" https://github.com/KhronosGroup/Vulkan-Headers "$RUNNER_TEMP/Vulkan-Headers"

      - name: Toolchain
        run: |
          # the plugin needs the macOS 15 SDK (MTLResidencySet, MTLLogState); README asks for Xcode 16
          if [ -d /Applications/Xcode_16.4.app ]; then sudo xcode-select -s /Applications/Xcode_16.4.app; fi
          xcodebuild -version
          xcrun --show-sdk-version
          xcrun clang --version | head -1
          xcodebuild -version | sed -n 1p | grep -q '^Xcode 16\.' || { echo "STOP: Xcode 16 is required"; exit 1; }

      - name: Base source (unmodified)
        run: |
          git merge-base --is-ancestor "$BASE_COMMIT" HEAD || { echo "STOP: this branch is not based on $DRIVER_VERSION ($BASE_COMMIT)"; exit 1; }
          echo "base commit: $BASE_COMMIT ($DRIVER_VERSION)"
          mkdir -p "$RUNNER_TEMP/base"
          git archive "$BASE_COMMIT" plugin | tar -x -C "$RUNNER_TEMP/base"

      - name: Build
        run: |
          set -euo pipefail
          build() {   # $1 = plugin source dir, $2 = output file
            ( cd "$1" && xcrun clang -arch x86_64 -mmacosx-version-min=15.0 -bundle -fobjc-arc -O1 -DNVMTL_RELEASE=1 \
                -Wno-protocol -Wno-incomplete-implementation -I"$RUNNER_TEMP/Vulkan-Headers/include" \
                -o "$2" NVMTLDevice.m -framework Foundation -framework Metal -framework IOSurface -framework IOKit )
            codesign -f -s - "$2"
          }
          mkdir -p out
          build "$GITHUB_WORKSPACE/plugin" "$GITHUB_WORKSPACE/out/NVMTLDriver"
          build "$RUNNER_TEMP/base/plugin" "$GITHUB_WORKSPACE/out/NVMTLDriver-base"

      - name: Check
        run: |
          set -euo pipefail
          miss=0
          for b in out/NVMTLDriver out/NVMTLDriver-base; do
            echo "== $b"
            lipo -archs "$b"
            [ "$(lipo -archs "$b")" = x86_64 ] || { echo "  not x86_64"; miss=$((miss+1)); }
            minos=$(otool -l "$b" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')
            echo "  minos $minos"
            [ "$minos" = 15.0 ] || { echo "  minimum macOS is not 15.0"; miss=$((miss+1)); }
            codesign -dv "$b" 2>&1 | grep -E 'Signature|Identifier' || true
            # markers build/build_plugin.sh checks: live features must be present, diagnostics absent in release
            while IFS='|' read -r feat pat; do
              [ -z "$feat" ] && continue
              n=$(strings -a "$b" | grep -c -- "$pat" || true)
              case "$feat" in
                "fps file"|"passtime instrument") [ "$n" -eq 0 ] || { echo "  LEAKED diagnostic $feat"; miss=$((miss+1)); } ;;
                *) [ "$n" -ge 1 ] || { echo "  MISSING $feat ($pat)"; miss=$((miss+1)); } ;;
              esac
            done <<'M'
          vendor compiler lane (NVIDIAShared)|NVIDIAShared
          SASS dispatch on NVK (sasspipe)|nvmtl_nvk_dispatch_sass_v1
          vendor variant (Apple MTLCompiler handshake)|vendor variant
          bindless-all heap slots|bindless-all - textures reach shaders
          dirty-only bindings|NVMTL_NO_DIRTYONLY
          fullclear (Apple whole-attachment clear)|begin_render: fullclear
          per-stage binding mask (gfx-bmask)|gmask
          fps file|nvmtl-fps-
          passtime instrument|nvmtl-passtime-request
          library key memo (xlate)|library key memo: hit
          res2-evict (Apple order: newest wins the card)|on the allocating thread
          M
          done
          echo "== change marker"
          n=$(strings -a out/NVMTLDriver | grep -c "NVMTL_SURFACE_COPYOUT" || true)
          echo "  patched: $n"; [ "$n" -ge 1 ] || { echo "  patched build lacks the change"; miss=$((miss+1)); }
          n=$(strings -a out/NVMTLDriver-base | grep -c "NVMTL_SURFACE_COPYOUT" || true)
          echo "  base: $n"; [ "$n" -eq 0 ] || { echo "  base build contains the change"; miss=$((miss+1)); }
          [ "$miss" = 0 ] || { echo "STOP: $miss problem(s)"; exit 1; }

      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          cp .github/plugin-artifact/INSTALL.txt out/INSTALL.txt
          ( cd out && shasum -a 256 NVMTLDriver NVMTLDriver-base > SHA256SUMS )
          { echo "driver $DRIVER_VERSION"; echo "source $SRC_COMMIT"; echo "base   $BASE_COMMIT"
            xcodebuild -version | sed -n 1p; } > out/BUILD.txt
          cat out/BUILD.txt out/SHA256SUMS
          echo "name=NVMTLDriver-$DRIVER_VERSION-$(echo "$SRC_COMMIT" | cut -c1-7)-macos15-x86_64" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: out/
          if-no-files-found: error
